# online.swos.eu: SWOS United's server's web side (docs/SERVER_SETUP.md). The game itself talks
# to the matchmaker on 19602, not here: nginx only serves the admin page, the recordings and
# the match reports -- all of it behind one login (/etc/nginx/.htpasswd-matchmaker-admin).
#   sudo htpasswd -B /etc/nginx/.htpasswd-matchmaker-admin <name>     add a login
#   sudo htpasswd -D /etc/nginx/.htpasswd-matchmaker-admin <name>     remove one
server {
    listen 80;
    listen [::]:80;
    server_name online.swos.eu;
    # Plain http only redirects (certbot --nginx adds its own challenge location to renew).
    location / { return 301 https://online.swos.eu$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name online.swos.eu;

    ssl_certificate     /etc/letsencrypt/live/online.swos.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/online.swos.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    auth_basic "SWOS United server";
    auth_basic_user_file /etc/nginx/.htpasswd-matchmaker-admin;

    location = / { auth_basic off; default_type text/plain; return 200 "SWOS United online server\n"; }

    # (The recordings player's /playback/: scripts/swos-matchmaker-service.sh adds its include
    # line above /recordings/ the first time the player is built -- do not add one here.)
    location /recordings/ {
        alias /srv/swos-matchmaker/recordings/;
        autoindex on;
        autoindex_exact_size on;    # exact bytes: the fetch scripts delete only a file at the size they fetched
    }

    location /reports/ {
        alias /srv/swos-matchmaker/reports/;
        autoindex on;
    }

    # The admin page: an unprivileged gateway on 127.0.0.1:8899.
    location /cc/ {
        proxy_pass http://127.0.0.1:8899/;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}
